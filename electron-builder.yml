appId: app.ruleon.desktop
productName: Ruleon
# CI sets GITHUB_TOKEN; we publish via workflow artifacts / softprops/action-gh-release.
publish: null
icon: build/icons/512x512.png
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**

# Default Linux targets (snap + AppImage) build in parallel and can race on
# ~/.cache/electron-builder/appimage downloads. Use one portable target.
linux:
  target:
    - AppImage
  category: Office
  icon: build/icons

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icons/512x512.png
