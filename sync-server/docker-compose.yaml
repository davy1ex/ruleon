services:
  sync-server:
    build:
      context: ..
      dockerfile: sync-server/Dockerfile
    expose:
      - "8080"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      API_KEY: ${API_KEY}
      PORT: 8080
    volumes:
      - sync-dbs:/app/dbs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sync-dbs:
